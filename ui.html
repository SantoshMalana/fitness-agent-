<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f4f5f8; --panel: #ffffff; --panel-2: #f8f9fb; --text: #161b26; --muted: #6b7385;
    --border: #e4e7ed; --accent: #4f46e5; --accent-2: #7c3aed; --accent-soft: #eef0ff;
    --user-text: #ffffff; --bot: #ffffff; --tool: #f6f7fb; --tool-border: #e1e4ee;
    --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1016; --panel: #161922; --panel-2: #1c202b; --text: #e7e9ee; --muted: #8f97a8;
      --border: #272c38; --accent: #818cf8; --accent-2: #a78bfa; --accent-soft: #23264a;
      --user-text: #0e1016; --bot: #1c202b; --tool: #191c26; --tool-border: #2b3040;
      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100vh; }

  /* ---------- chat column ---------- */
  main { display: flex; flex-direction: column; min-height: 0; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px;
    border-bottom: 1px solid var(--border); background: var(--panel); }
  .logo { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 19px; }
  header h1 { margin: 0; font-size: 16px; font-weight: 700; }
  header .sub { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }

  #chat { flex: 1; overflow-y: auto; padding: 24px; }
  .thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .turn { display: flex; gap: 10px; align-items: flex-end; }
  .turn.user { justify-content: flex-end; }
  .avatar { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: 15px; background: var(--accent-soft); }
  .bubble { max-width: min(78%, 620px); padding: 11px 15px; border-radius: 16px; word-wrap: break-word; }
  .user .bubble { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--user-text);
    border-bottom-right-radius: 5px; white-space: pre-wrap; }
  .bot .bubble { background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 5px; box-shadow: var(--shadow); }
  .bot .bubble.err { border-color: var(--bad); color: var(--bad); }
  .bubble > :first-child { margin-top: 0; } .bubble > :last-child { margin-bottom: 0; }
  .bubble p { margin: 0 0 8px; } .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 20px; }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 5px 9px; text-align: left; }
  .bubble th { background: var(--panel-2); font-weight: 600; }
  .bubble code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 15px; margin: 10px 0 6px; }

  .tools { margin-left: 40px; display: flex; flex-direction: column; gap: 6px; max-width: min(78%, 620px); }
  details.tool { background: var(--tool); border: 1px solid var(--tool-border); border-radius: 10px; font-size: 12.5px; }
  details.tool summary { padding: 7px 11px; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool summary b { color: var(--accent); font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
  details.tool summary .chev { margin-left: auto; transition: transform .15s; }
  details.tool[open] summary .chev { transform: rotate(90deg); }
  details.tool pre { margin: 0; padding: 8px 11px; border-top: 1px solid var(--tool-border);
    font: 12px/1.45 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

  .welcome { text-align: center; padding: 6vh 12px 0; }
  .welcome .big { font-size: 44px; }
  .welcome h2 { margin: 8px 0 4px; font-size: 22px; }
  .welcome p { color: var(--muted); margin: 0 0 22px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 12px;
    padding: 12px 14px; font-size: 13.5px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; text-align: left; }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .chip .ic { display: block; font-size: 18px; margin-bottom: 4px; }

  .composer-wrap { padding: 14px 24px 18px; background: linear-gradient(to top, var(--bg) 70%, transparent); }
  form#composer { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 6px 6px 6px 16px; box-shadow: var(--shadow); }
  form#composer:focus-within { border-color: var(--accent); }
  #input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; padding: 8px 0; min-width: 0; }
  .send { width: 40px; height: 40px; border: 0; border-radius: 12px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; font-size: 17px; }
  .send:disabled { opacity: .45; cursor: default; }
  .hint { max-width: 780px; margin: 6px auto 0; color: var(--muted); font-size: 11.5px; text-align: center; }

  /* ---------- sidebar ---------- */
  aside { background: var(--panel); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .card h3 { margin: 0 0 10px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center; }
  .meter-top { display: flex; align-items: center; gap: 16px; }
  .ring { width: 92px; height: 92px; flex: none; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring .pct { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 17px; }
  .stat .label { color: var(--muted); font-size: 12px; }
  .stat .val { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .stat .val.small { font-size: 15px; font-weight: 600; }
  .budget-form { display: flex; gap: 6px; margin-top: 12px; }
  .field { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--panel); color: var(--text); font: inherit; font-size: 14px; }
  .field:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .btn { border: 0; border-radius: 9px; padding: 8px 12px; background: var(--accent); color: #fff; font-weight: 600; font-size: 13.5px; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn.ghost:hover { color: var(--bad); border-color: var(--bad); }
  .link { background: none; border: 0; color: var(--accent); font-size: 12px; padding: 0; text-transform: none; letter-spacing: 0; }

  .cat { margin-bottom: 10px; } .cat:last-child { margin-bottom: 0; }
  .cat .row { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 4px; }
  .cat .row span:first-child { text-transform: capitalize; display: flex; align-items: center; gap: 7px; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; }
  .bar { height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; transition: width .4s; }
  .exp { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .exp:last-child { border-bottom: 0; }
  .exp .tag { font-size: 11px; color: var(--muted); background: var(--panel); border: 1px solid var(--border);
    padding: 1px 7px; border-radius: 999px; margin-left: 6px; text-transform: capitalize; }
  .exp .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty-note { color: var(--muted); font-size: 13px; }
  .key-ok { color: var(--ok); font-size: 13px; font-weight: 500; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); height: auto; min-height: 100vh; }
    aside { order: -1; border-left: 0; border-bottom: 1px solid var(--border); padding: 16px; }
    main { height: 100vh; }
    #chat, .composer-wrap, header { padding-left: 16px; padding-right: 16px; }
    .bubble { max-width: 88%; } .tools { margin-left: 0; max-width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <main>
    <header>
      <div class="logo">₹</div>
      <div>
        <h1>Budget Assistant</h1>
        <div class="sub"><span class="dot" id="dot"></span><span id="model">connecting…</span></div>
      </div>
    </header>

    <div id="chat"><div class="thread" id="thread"></div></div>

    <div class="composer-wrap">
      <form id="composer">
        <input id="input" placeholder="Log an expense or ask “can I afford…?”" autocomplete="off">
        <button class="send" id="send" title="Send">➤</button>
      </form>
      <div class="hint">Every answer is checked against your real ledger via tool calls. Click a tool chip to see what it did.</div>
    </div>
  </main>

  <aside>
    <div class="card" id="keyCard">
      <h3>Groq API key</h3>
      <form class="budget-form" id="keyForm" style="margin-top:0">
        <input class="field" type="password" id="keyInput" placeholder="gsk_…">
        <button class="btn">Connect</button>
      </form>
    </div>

    <div class="card">
      <h3>This month</h3>
      <div class="meter-top">
        <div class="ring">
          <svg width="92" height="92" viewBox="0 0 92 92">
            <circle cx="46" cy="46" r="38" fill="none" stroke="var(--border)" stroke-width="9"/>
            <circle id="ringArc" cx="46" cy="46" r="38" fill="none" stroke="var(--accent)" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="238.76" stroke-dashoffset="238.76" style="transition: stroke-dashoffset .5s, stroke .3s"/>
          </svg>
          <div class="pct" id="pct">–</div>
        </div>
        <div style="display:grid; gap:6px">
          <div class="stat"><div class="label">Spent</div><div class="val" id="spent">₹0</div></div>
          <div class="stat"><div class="label" id="remLabel">Remaining</div><div class="val small" id="remaining">Set a budget</div></div>
        </div>
      </div>
      <form class="budget-form" id="budgetForm">
        <input class="field" type="number" min="1" step="any" id="budgetInput" placeholder="Monthly budget (₹)">
        <button class="btn">Set</button>
      </form>
    </div>

    <div class="card">
      <h3>By category</h3>
      <div id="cats"><div class="empty-note">No expenses yet.</div></div>
    </div>

    <div class="card">
      <h3>Expenses <span id="count" style="text-transform:none; letter-spacing:0"></span></h3>
      <div id="list"><div class="empty-note">No expenses yet.</div></div>
    </div>

    <button class="btn ghost" id="reset">↺ Reset session</button>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const thread = $("thread"), chatBox = $("chat");
const money = n => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
const PALETTE = ["#4f46e5", "#0ea5e9", "#16a34a", "#f59e0b", "#ec4899", "#8b5cf6", "#14b8a6", "#ef4444"];
const catColor = {};
const colorFor = c => catColor[c] ??= PALETTE[Object.keys(catColor).length % PALETTE.length];
let busy = false;

const SUGGESTIONS = [
  ["🎯", "My monthly budget is 20000 rupees. Log 3000 for rent, category housing."],
  ["🛒", "Log 450 for groceries, category food, and 200 for a movie, category fun."],
  ["🍔", "How much have I spent on food so far?"],
  ["✈️", "Can I afford a 2000 rupee trip this month?"],
];

function md(text) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text || ""));
  const d = document.createElement("div"); d.textContent = text || ""; return d.innerHTML.replace(/\n/g, "<br>");
}
const scroll = () => chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: "smooth" });

function showWelcome() {
  thread.innerHTML = `<div class="welcome"><div class="big">💸</div><h2>Where's your money going?</h2>
    <p>Log expenses in plain English and ask what you can afford.</p><div class="chips"></div></div>`;
  const chips = thread.querySelector(".chips");
  SUGGESTIONS.forEach(([ic, text]) => {
    const b = document.createElement("button");
    b.className = "chip"; b.innerHTML = `<span class="ic">${ic}</span>`;
    b.append(text); b.onclick = () => send(text);
    chips.appendChild(b);
  });
}

function addTurn(role, content, isError) {
  thread.querySelector(".welcome")?.remove();
  const turn = document.createElement("div");
  turn.className = "turn " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (isError ? " err" : "");
  if (role === "user") bubble.textContent = content;
  else bubble.innerHTML = isError ? "" : md(content);
  if (isError) bubble.textContent = "⚠ " + content;
  if (role === "bot") turn.innerHTML = '<div class="avatar">🤖</div>';
  turn.appendChild(bubble);
  thread.appendChild(turn);
  scroll();
  return turn;
}

function addTools(trace) {
  if (!trace?.length) return;
  const wrap = document.createElement("div");
  wrap.className = "tools";
  trace.forEach(t => {
    const d = document.createElement("details");
    d.className = "tool";
    const icon = t.tool === "add_expense" ? "➕" : "📊";
    let args = t.args; try { args = JSON.stringify(JSON.parse(t.args)); } catch {}
    d.innerHTML = `<summary>${icon} <b></b><span></span><span class="chev">›</span></summary><pre></pre>`;
    d.querySelector("b").textContent = t.tool;
    d.querySelector("summary span").textContent = args.length > 60 ? args.slice(0, 57) + "…" : args;
    d.querySelector("pre").textContent = "args:   " + args + "\nresult: " + JSON.stringify(t.result, null, 2);
    wrap.appendChild(d);
  });
  thread.appendChild(wrap);
}

function render(s) {
  $("dot").classList.toggle("on", s.has_key);
  $("model").textContent = (s.has_key ? "Connected · " : "Not connected · ") + s.model;
  $("keyCard").style.display = s.has_key ? "none" : "";

  const spent = s.total_spent, budget = s.budget;
  $("spent").textContent = money(spent);
  const arc = $("ringArc"), C = 238.76;
  if (budget) {
    const ratio = spent / budget, left = budget - spent;
    const color = ratio >= 1 ? "var(--bad)" : ratio >= .8 ? "var(--warn)" : "var(--ok)";
    arc.style.strokeDashoffset = C * (1 - Math.min(ratio, 1));
    arc.style.stroke = color;
    $("pct").textContent = Math.round(ratio * 100) + "%";
    $("remLabel").textContent = left >= 0 ? `Remaining of ${money(budget)}` : `Over ${money(budget)} by`;
    $("remaining").textContent = money(Math.abs(left));
    $("remaining").style.color = color;
    $("budgetInput").placeholder = "Change budget (now " + money(budget) + ")";
  } else {
    arc.style.strokeDashoffset = C; $("pct").textContent = "–";
    $("remLabel").textContent = "Remaining"; $("remaining").textContent = "Set a budget"; $("remaining").style.color = "";
    $("budgetInput").placeholder = "Monthly budget (₹)";
  }

  const ex = s.expenses;
  $("count").textContent = ex.length ? `(${ex.length})` : "";
  if (!ex.length) {
    $("cats").innerHTML = $("list").innerHTML = '<div class="empty-note">No expenses yet.</div>';
    return;
  }
  const by = {};
  ex.forEach(e => by[e.category.toLowerCase()] = (by[e.category.toLowerCase()] || 0) + e.amount);
  $("cats").innerHTML = "";
  Object.entries(by).sort((a, b) => b[1] - a[1]).forEach(([c, v]) => {
    const el = document.createElement("div");
    el.className = "cat";
    el.innerHTML = `<div class="row"><span><i class="swatch"></i><span></span></span><span>${money(v)} · ${Math.round(v / spent * 100)}%</span></div>
      <div class="bar"><div></div></div>`;
    el.querySelector(".swatch").style.background = colorFor(c);
    el.querySelector(".row span span").textContent = c;
    Object.assign(el.querySelector(".bar > div").style, { width: (v / spent * 100) + "%", background: colorFor(c) });
    $("cats").appendChild(el);
  });
  $("list").innerHTML = "";
  ex.slice().reverse().forEach(e => {
    const el = document.createElement("div");
    el.className = "exp";
    el.innerHTML = `<span><span></span><span class="tag"></span></span><span class="amt">${money(e.amount)}</span>`;
    el.querySelector("span span").textContent = e.item;
    el.querySelector(".tag").textContent = e.category;
    $("list").appendChild(el);
  });
}

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  });
  const data = await r.json();
  if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { data });
  return data;
}

async function send(text) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true; $("input").value = "";
  addTurn("user", text);
  const typing = addTurn("bot", "");
  typing.querySelector(".bubble").innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  try {
    const d = await api("/api/chat", { message: text });
    typing.remove();
    addTools(d.trace);
    addTurn("bot", d.reply || "(no reply)");
    render(d);
  } catch (e) {
    typing.remove();
    addTools(e.data?.trace);
    addTurn("bot", e.message, true);
    api("/api/state").then(render);
  } finally {
    busy = false; $("send").disabled = false; $("input").focus(); scroll();
  }
}

$("composer").onsubmit = e => { e.preventDefault(); send($("input").value); };
$("budgetForm").onsubmit = e => {
  e.preventDefault();
  const v = Number($("budgetInput").value);
  if (v > 0) { $("budgetInput").value = ""; send(`My monthly budget is ${v} rupees.`); }
};
$("keyForm").onsubmit = async e => {
  e.preventDefault();
  try { render(await api("/api/key", { key: $("keyInput").value })); $("keyInput").value = ""; }
  catch (err) { alert(err.message); }
};
$("reset").onclick = async () => {
  if (!confirm("Clear all expenses, budget and chat history?")) return;
  render(await api("/api/reset", {}));
  showWelcome();
};

api("/api/state").then(s => {
  render(s);
  if (s.history.length) s.history.forEach(m => addTurn(m.role === "user" ? "user" : "bot", m.content));
  else showWelcome();
}).catch(() => { $("model").textContent = "Server not reachable — is app.py running?"; showWelcome(); });
$("input").focus();
</script>
</body>
</html>
